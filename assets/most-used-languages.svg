<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="650" rx="24" fill="url(#bg)"/>
  <rect x="5" y="5" width="990" height="640" rx="20"
        fill="none" stroke="url(#border)" stroke-width="4"/>

  <text x="500" y="75" text-anchor="middle"
        fill="#00D9FF" font-size="38" font-weight="bold">
    MOST USED LANGUAGES
  </text>

  <line x1="55" y1="105" x2="945" y2="105"
        stroke="#2563EB" stroke-width="3"/>

  <text x="500" y="350" text-anchor="middle"
        fill="#FFFFFF" font-size="25">
    Language statistics will be generated automatically
  </text>

  <text x="500" y="400" text-anchor="middle"
        fill="#94A3B8" font-size="19">
    Across all public repositories
  </text>
</svg>
