<line x1="55" y1="185" x2="1045" y2="185" stroke="#1E3A5F" stroke-width="2"/>
<text x="60" y="210" fill="#FFFFFF" font-size="25" font-weight="bold">Python</text>
<rect x="350" y="185" width="560" height="25" rx="12" fill="#263445"/>
