<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="437" viewBox="0 0 1100 437">

    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#020617"/>
        <stop offset="100%" stop-color="#0B1930"/>
      </linearGradient>

      <linearGradient id="border">
        <stop offset="0%" stop-color="#00E5FF"/>
        <stop offset="100%" stop-color="#2563EB"/>
      </linearGradient>

      <filter id="glow">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    
<rect width="1100" height="437" rx="28" fill="url(#bg)"/>
<rect x="4" y="4" width="1092" height="429" rx="25" fill="none" stroke="url(#border)" stroke-width="4"/>
