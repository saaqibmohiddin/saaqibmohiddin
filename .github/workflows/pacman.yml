
name: Futuristic Pac-Man Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/pacman.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate Neon Pac-Man
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man Animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: saaqibmohiddin
          games: "pacman"
          hide_month_labels: "false"

      - name: Publish Pac-Man Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}